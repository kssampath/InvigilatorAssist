# Jenkins Configuration as Code. Every ${VAR} is read from the container environment (ci/jenkins/.env, which is
# git-ignored), so no secret is stored in the repository.
jenkins:
  systemMessage: "InvigilatorAssist CI: Jenkins → ACR → GitOps (ArgoCD) → AKS. Configured as code from ci/jenkins/casc.yaml."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: ACR_LOGIN_SERVER
            value: "${ACR_LOGIN_SERVER:-}"
          - key: APP_URL
            value: "${APP_URL:-}"

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8081/}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: acr-credentials
              description: "Azure Container Registry push credentials"
              username: "${ACR_USERNAME:-unset}"
              password: "${ACR_PASSWORD:-unset}"
          - usernamePassword:
              scope: GLOBAL
              id: github-credentials
              description: "GitHub user + personal access token for the GitOps commit"
              username: "${GITHUB_USER:-unset}"
              password: "${GITHUB_TOKEN:-unset}"

jobs:
  - script: |
      pipelineJob('invigilatorassist') {
        displayName('InvigilatorAssist CI/CD')
        description('Test, build and push the API and web images to ACR, then update k8s/kustomization.yaml for ArgoCD.')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/2 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GIT_REPO_URL:-https://github.com/kssampath/InvigilatorAssist.git}')
                  credentials('github-credentials')
                }
                branch('*/${GIT_BRANCH:-master}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
