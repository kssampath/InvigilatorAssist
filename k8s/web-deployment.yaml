apiVersion: apps/v1
kind: Deployment
metadata:
  name: invigilator-web
  labels:
    app.kubernetes.io/name: invigilator-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: invigilator-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invigilator-web
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: acr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: invigilator-web
      containers:
        - name: web
          image: invigilator-web          # registry and tag set in kustomization.yaml by Jenkins
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: invigilator-api:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp                     # nginx pid + temp files
              mountPath: /tmp
            - name: conf                    # nginx writes the rendered template here at start-up
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
