# Local development stack. Values default to throwaway local-only settings; override them in a .env file
# next to this file (git-ignored) if you like.
#
#   docker compose up -d db          → just PostgreSQL (run the API from your IDE with the dev profile)
#   docker compose --profile full up --build
#                                    → PostgreSQL + API on http://localhost:8080 + web on http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invigilator
      POSTGRES_USER: invigilator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invigilator}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invigilator -d invigilator"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: invigilator-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/invigilator
      DB_USERNAME: invigilator
      DB_PASSWORD: ${POSTGRES_PASSWORD:-invigilator}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    profiles: ["full"]

  web:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: invigilator-web:local
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "3000:8080"
    profiles: ["full"]

volumes:
  pgdata:
